name: production
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://unwatched.world
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DO_APP_ID: ${{ vars.DO_APP_ID }}
      DO_REGISTRY: ${{ vars.DO_REGISTRY }}
      UW_PUBLIC_URL: ${{ vars.UW_PUBLIC_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          version: 1.168.0
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Not a stable published release") else "Published release verified" end'
          latest=$(gh release view --json tagName --jq .tagName)
          [[ "$latest" == "$RELEASE_TAG" ]] || { echo "A newer release exists; refusing an automatic rollback"; exit 1; }
      - name: Build and deploy both services
        run: bash deploy/release.sh
